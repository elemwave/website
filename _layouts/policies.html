layout: default

<!--This file comes from minimal-mistakes repository, to check what files are downloaded from the original repository check at Docs/original-files-from-theme-repository.md -->

<div id="main" role="main">
  <article class="splash" itemscope itemtype="https://schema.org/CreativeWork">
    {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
    {% if page.excerpt %}<meta itemprop="description" content="{{ page.excerpt | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}

    <section>
      {% include feature_row id="intro" type="center" %}
      <div class="feature__wrapper full_page">
        <div class="content-container policies-container">
            {{ content }}
        </div>
      </div>
    </section>
  </article>
</div>
